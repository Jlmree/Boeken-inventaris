<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boekenkast</title>
<meta name="theme-color" content="#2f5d50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>📚 Boekenkast</h1>
  <span id="count" class="muted"></span>
  <span id="syncstate" class="muted" title="Synchronisatiestatus"></span>
</header>

<main>
  <!-- Overzicht -->
  <section id="view-books" class="view">
    <input id="search" type="search" placeholder="Zoek op titel, auteur, ISBN…" autocomplete="off">
    <div class="chips" id="filters">
      <button data-f="all" class="on">Alles</button>
      <button data-f="unread">Ongelezen</button>
      <button data-f="read">Gelezen</button>
      <button data-f="lent-out">Uitgeleend</button>
      <button data-f="lent-in">Geleend</button>
    </div>
    <div class="row">
      <select id="ownerFilter" aria-label="Eigenaar"><option value="">Van iedereen</option></select>
      <select id="categoryFilter" aria-label="Categorie"><option value="">Alle categorieën</option></select>
    </div>
    <div class="row">
      <select id="genreFilter" aria-label="Genre"><option value="">Alle genres</option></select>
      <select id="sort" aria-label="Sorteren">
        <option value="added">Nieuwste eerst</option>
        <option value="title">Titel A–Z</option>
        <option value="author">Auteur A–Z</option>
      </select>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted center" hidden>Nog geen boeken. Ga naar <b>Scannen</b> om je eerste boek toe te voegen.</p>
  </section>

  <!-- Scannen -->
  <section id="view-scan" class="view" hidden>
    <div class="scanbox">
      <video id="video" playsinline muted></video>
      <div class="reticle"></div>
    </div>
    <p id="scanmsg" class="muted center">Houd de barcode (achterkant boek) in beeld.</p>
    <div class="row">
      <button id="scanStart" class="primary">Camera starten</button>
      <label class="btn">Foto kiezen<input id="photo" type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <form id="manual" class="row">
      <input id="isbnInput" inputmode="numeric" placeholder="of typ ISBN" aria-label="ISBN">
      <button type="submit">Zoek</button>
    </form>
    <button id="blank" class="link">Zonder barcode toevoegen</button>
  </section>

  <!-- Instellingen -->
  <section id="view-settings" class="view" hidden>
    <h2>Instellingen</h2>
    <label>Mijn naam
      <input id="setName" placeholder="bv. Jelmer" autocomplete="off">
    </label>
    <h3>Gezin delen (synchronisatie)</h3>
    <p class="muted">Zonder deze gegevens staan de boeken alleen op dit toestel. Zie README voor de 5-minuten installatie van Supabase.</p>
    <label>Gezinscode (zelf verzinnen, geheim houden)
      <input id="setFamily" autocomplete="off">
    </label>
    <label>Supabase URL
      <input id="setUrl" placeholder="https://xxxx.supabase.co" autocomplete="off">
    </label>
    <label>Supabase anon key
      <input id="setKey" autocomplete="off">
    </label>
    <div class="row">
      <button id="saveSettings" class="primary">Opslaan &amp; synchroniseren</button>
      <button id="exportCsv">Export CSV</button>
    </div>
    <p id="setmsg" class="muted"></p>
  </section>
</main>

<nav class="tabs">
  <button data-v="books" class="on">📖<span>Boeken</span></button>
  <button data-v="scan">📷<span>Scannen</span></button>
  <button data-v="settings">⚙️<span>Instellingen</span></button>
</nav>

<dialog id="dlg">
  <form id="bookForm" method="dialog">
    <div class="dhead">
      <div id="dcover" class="cover big"></div>
      <div>
        <input id="fTitle" placeholder="Titel" required>
        <input id="fAuthors" placeholder="Auteur(s)">
        <small id="fMeta" class="muted"></small>
      </div>
    </div>
    <div class="row">
      <label>Categorie
        <select id="fCategory"></select>
      </label>
      <label>Genre
        <input id="fGenre" list="genres" placeholder="bv. Thriller" autocomplete="off">
        <datalist id="genres"></datalist>
      </label>
    </div>
    <label>Van wie is het boek?
      <input id="fOwner" list="owners" placeholder="naam">
      <datalist id="owners"></datalist>
    </label>
    <label class="check"><input type="checkbox" id="fRead"> Gelezen</label>
    <label id="readByRow">Gelezen door
      <input id="fReadBy" placeholder="bv. Anna, Tom">
    </label>
    <label>Uitgeleend / geleend
      <select id="fLoan">
        <option value="">Niet uitgeleend</option>
        <option value="out">Uitgeleend aan…</option>
        <option value="in">Geleend van…</option>
      </select>
    </label>
    <div id="loanRow" class="row" hidden>
      <input id="fWho" placeholder="Naam">
      <input id="fSince" type="date" aria-label="Sinds">
    </div>
    <label>Notities
      <textarea id="fNotes" rows="2"></textarea>
    </label>
    <input type="hidden" id="fIsbn"><input type="hidden" id="fCover">
    <div class="row">
      <button type="submit" class="primary" value="save">Opslaan</button>
      <button type="button" id="dDelete" class="danger">Verwijderen</button>
      <button type="button" id="dClose">Sluiten</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
